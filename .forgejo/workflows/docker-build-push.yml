# Tests StreamTube, builds its Docker image on every push to main, scans it with Trivy, then pushes it to the
# private registry at 10.0.1.13:5000 (Gray Goo) as :<short sha> and :latest. No registry auth required.
#
# Failing tests stop the build. Trivy gates the push: any CRITICAL vulnerability with a known fix fails the job
# before the image reaches the registry. HIGH findings are reported but don't block.
#
# runs-on: docker matches Drydock's runner label: jobs run directly on Drydock against its native dockerd,
# no DinD sidecar involved.

name: Build, Scan, and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-scan-push:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Resolve image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          docker run --rm -v "$PWD":/src:ro node:24-trixie-slim sh -c \
            'cp -r /src /app && cd /app && npm ci --no-audit --no-fund --silent && npm test'

      - name: Build image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -t 10.0.1.13:5000/streamtube:${{ steps.vars.outputs.sha_short }} \
            -t 10.0.1.13:5000/streamtube:latest \
            .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            10.0.1.13:5000/streamtube:${{ steps.vars.outputs.sha_short }}

      - name: Push image
        run: |
          docker push 10.0.1.13:5000/streamtube:${{ steps.vars.outputs.sha_short }}
          docker push 10.0.1.13:5000/streamtube:latest
