# Forgejo deploy pipeline: tests StreamTube, builds its Docker image on every push to main, scans it with Trivy,
# then pushes it to a private registry as :<short sha> and :latest. Set the repository variable REGISTRY to the
# registry's host:port (no registry auth is used).
#
# Failing tests stop the build. Trivy gates the push: any CRITICAL vulnerability with a known fix fails the job
# before the image reaches the registry. HIGH findings are reported but don't block.
#
# runs-on: docker expects a runner with that label and access to a native dockerd (no DinD sidecar).

name: Build, Scan, and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  REGISTRY: ${{ vars.REGISTRY || '10.0.1.13:5000' }}

jobs:
  build-scan-push:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Resolve image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          docker run --rm -v "$PWD":/src:ro node:24-trixie-slim sh -c \
            'cp -r /src /app && cd /app && npm ci --no-audit --no-fund --silent && npm test'

      - name: Build image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -t ${{ env.REGISTRY }}/streamtube:${{ steps.vars.outputs.sha_short }} \
            -t ${{ env.REGISTRY }}/streamtube:latest \
            .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ env.REGISTRY }}/streamtube:${{ steps.vars.outputs.sha_short }}

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/streamtube:${{ steps.vars.outputs.sha_short }}
          docker push ${{ env.REGISTRY }}/streamtube:latest
