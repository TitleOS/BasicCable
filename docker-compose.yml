services:
  basiccable:
    image: ghcr.io/titleos/basiccable:latest
    # To build from a checkout of the repo instead, replace the line above with "build: .".
    container_name: basiccable
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      # Your local timezone (an IANA name such as America/New_York or Europe/London): the guide, schedules and
      # time slots use it. Change it from UTC, or set it later in the web UI under Settings.
      TZ: UTC
      # The address other devices on your network use to reach this box.
      # Optional: if empty, Basic Cable uses whatever address Stremio installed the addon from.
      BASE_URL: ""
      # Password for the web UI, its API and the MCP server (user name can be anything). Strongly recommended.
      # The Stremio addon and live streams stay open, since Stremio can't send a password.
      ADMIN_PASSWORD: ""
    volumes:
      - ./data:/data
    # Live segments and the read-ahead buffer live here; keep them in RAM. Budget ~250 MB per watched 1080p
    # channel (up to ~1 GB for a 4K remux). The read-ahead shrinks itself if this fills up.
    tmpfs:
      - /tmp/basiccable-hls:size=2g
