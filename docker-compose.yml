services:
  streamtube:
    build: .
    image: streamtube:latest
    container_name: streamtube
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      # Your local timezone: schedules and time slots use it.
      TZ: America/Chicago
      # The address other devices on your network use to reach this box.
      # Optional: if empty, StreamTube uses whatever address Stremio installed the addon from.
      BASE_URL: ""
      # Optional password for the web UI (user name can be anything). Stremio endpoints stay open.
      ADMIN_PASSWORD: ""
    volumes:
      - ./data:/data
    # Live segments and the read-ahead buffer live here; keep them in RAM. Budget ~250 MB per watched 1080p
    # channel (up to ~1 GB for a 4K remux). The read-ahead shrinks itself if this fills up.
    tmpfs:
      - /tmp/streamtube-hls:size=2g
