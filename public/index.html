<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamTube</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>StreamTube</span></div>
    <nav id="nav">
      <a href="#/guide" data-view="guide">Guide</a>
      <a href="#/channels" data-view="channels">Channels</a>
      <a href="#/commercials" data-view="commercials">Commercials</a>
      <a href="#/settings" data-view="settings">Settings</a>
      <a href="#/connect" data-view="connect">Connect</a>
    </nav>
    <div class="clock"><span id="clock-time">--:--:--</span><small id="clock-date"></small></div>
  </header>
  <main id="view"></main>
  <div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
